<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rocks & Gems — Vivien's Birthday 💙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #050f1e; overflow-x: hidden; }
    body { font-family: 'Georgia', serif; background: linear-gradient(160deg, #050f1e 0%, #0d2340 50%, #071628 100%); min-height: 100vh; color: #e8f4fd; }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; background: #90caf9; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    body { padding-top: 58px; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(5,15,30,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(100,180,255,0.1); }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; background: rgba(13,35,64,0.7); border: 1px solid rgba(100,180,255,0.22); border-radius: 100px; color: #90caf9; text-decoration: none; font-size: 0.85rem; transition: background 0.2s, border-color 0.2s; white-space: nowrap; flex-shrink: 0; }
    .back-btn:hover { background: rgba(20,50,90,0.9); border-color: rgba(100,180,255,0.4); }
    .header-title { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; color: #bbdefb; min-width: 0; }
    .header-spacer { width: 72px; flex-shrink: 0; }
    .header-icon { font-size: 1.1rem; flex-shrink: 0; }
    .header-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .to-top { position: fixed; bottom: 24px; right: 20px; z-index: 200; width: 42px; height: 42px; background: rgba(13,35,64,0.85); border: 1px solid rgba(100,180,255,0.28); border-radius: 50%; color: #90caf9; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(8px); transition: opacity 0.3s, transform 0.3s, background 0.2s; pointer-events: none; }
    .to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .to-top:hover { background: rgba(20,50,95,0.95); border-color: rgba(100,180,255,0.5); }
    .page-hero { position: relative; z-index: 1; text-align: center; padding: 28px 20px 16px; }
    .page-icon { font-size: 2.8rem; display: block; margin-bottom: 10px; animation: float 3.5s ease-in-out infinite; }
    .page-hero h1 { font-size: clamp(1.8rem,6vw,3rem); background: linear-gradient(135deg,#90caf9,#e3f2fd 45%,#42a5f5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .photo-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; max-width: 920px; margin: 0 auto; padding: 16px 16px 60px; position: relative; z-index: 1; }
    @media (min-width: 560px) { .photo-grid { grid-template-columns: repeat(3,1fr); } }
    @media (min-width: 860px) { .photo-grid { grid-template-columns: repeat(4,1fr); max-width: 1200px; } }
    @media (min-width: 1200px) { .photo-grid { grid-template-columns: repeat(5,1fr); max-width: 1500px; } }
    .photo-card { border-radius: 18px; overflow: hidden; aspect-ratio: 1; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.45); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; background: #0d2340; }
    .photo-card:hover { transform: scale(1.05); box-shadow: 0 8px 32px rgba(100,180,255,0.28); }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.3s ease; }
    .photo-card:hover img { filter: brightness(1.1) saturate(1.15); }
    .photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent,rgba(2,18,50,0.85)); color: #ddeeff; padding: 22px 12px 10px; font-size: 0.82rem; opacity: 0; transition: opacity 0.3s ease; }
    .photo-card:hover .photo-label { opacity: 1; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,8,24,0.96); z-index: 1000; justify-content: center; align-items: center; padding: 55px 20px 20px; }
    .lightbox.active { display: flex; }
    .lightbox-content { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 540px; }
    .lightbox-content img { width: 100%; max-height: 48vh; object-fit: contain; border-radius: 14px; box-shadow: 0 0 60px rgba(80,160,255,0.25); }
    .lightbox-fact { color: #b0d8f5; font-size: 0.9rem; text-align: center; line-height: 1.7; padding: 14px 18px; background: rgba(13,35,64,0.75); border-radius: 14px; border: 1px solid rgba(100,180,255,0.18); font-style: italic; width: 100%; }
    @media (min-width: 640px) { .lightbox-content { flex-direction: row; max-width: 860px; align-items: center; gap: 28px; } .lightbox-content img { width: auto; max-width: 55%; max-height: 78vh; } .lightbox-fact { flex: 1; text-align: left; font-size: 0.95rem; } }
    .lightbox-close { position: fixed; top: 16px; right: 20px; background: none; border: 2px solid #2a5a9e; color: #90caf9; font-size: 1.4rem; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 10; }
    .lightbox-close:hover { background: rgba(100,180,255,0.15); }
  </style>
</head>
<body>
<div class="stars" id="stars"></div>
<header class="site-header">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="header-title">
    <span class="header-icon">🪨</span>
    <span class="header-name">Rocks & Gems</span>
  </div>
  <div class="header-spacer"></div>
</header>
<header class="page-hero">
  <span class="page-icon">🪨</span>
  <h1>Rocks & Gems</h1>
</header>
<div class="photo-grid">
  <div class="photo-card" data-fact="Sapphires are colorless in their pure form. The blue comes from tiny traces of iron and titanium locked inside the crystal structure — a beautiful accident of chemistry that took millions of years. 💙" onclick="openLightbox(this)">
    <img src="images/rocks/sapphire.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/sapphire,crystal,blue,gem'" alt="Sapphire" loading="lazy">
    <div class="photo-label">Sapphire</div>
  </div>
  <div class="photo-card" data-fact="Blue topaz doesn't occur in nature — all blue topaz starts as colorless topaz that is irradiated and heat-treated in a lab. Scientists literally invented this shade of blue. 🔬" onclick="openLightbox(this)">
    <img src="images/rocks/blue-topaz.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,topaz,gemstone,crystal'" alt="Blue Topaz" loading="lazy">
    <div class="photo-label">Blue Topaz</div>
  </div>
  <div class="photo-card" data-fact="Turquoise is one of the oldest minerals worn by humans — ancient Egyptians mined it over 6,000 years ago. It has been a symbol of protection in nearly every civilization on Earth. 🌍" onclick="openLightbox(this)">
    <img src="images/rocks/turquoise.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/turquoise,mineral,stone,blue'" alt="Turquoise" loading="lazy">
    <div class="photo-label">Turquoise</div>
  </div>
  <div class="photo-card" data-fact="Before blue paint was invented, artists ground lapis lazuli into powder to make ultramarine — the most expensive pigment in the world. Vermeer's paintings used it. A rock became art. 🎨" onclick="openLightbox(this)">
    <img src="images/rocks/lapis-lazuli.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/lapis,lazuli,blue,mineral'" alt="Lapis Lazuli" loading="lazy">
    <div class="photo-label">Lapis Lazuli</div>
  </div>
  <div class="photo-card" data-fact="Aquamarine literally means 'water of the sea' in Latin. Ancient sailors wore it as protection, believing it was treasure from mermaids washed up from the deep ocean floor. 🧜" onclick="openLightbox(this)">
    <img src="images/rocks/aquamarine.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/aquamarine,crystal,blue,gem'" alt="Aquamarine" loading="lazy">
    <div class="photo-label">Aquamarine</div>
  </div>
  <div class="photo-card" data-fact="Opals display different colors from every angle — called 'play of color.' No two opals in the world show the exact same pattern. Every single opal is genuinely one of a kind. ✨" onclick="openLightbox(this)">
    <img src="images/rocks/blue-opal.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,opal,gemstone,mineral'" alt="Blue Opal" loading="lazy">
    <div class="photo-label">Blue Opal</div>
  </div>
  <div class="photo-card" data-fact="Agate forms inside gas bubbles in volcanic rock — minerals seep in layer by layer over millions of years, leaving behind those beautiful bands. Each stripe is a chapter of Earth's history. 🌋" onclick="openLightbox(this)">
    <img src="images/rocks/blue-agate.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,agate,mineral,banded'" alt="Blue Agate" loading="lazy">
    <div class="photo-label">Blue Agate</div>
  </div>
  <div class="photo-card" data-fact="Fluorite glows a vivid blue-violet under ultraviolet light. The word 'fluorescence' was literally named after fluorite — it's where that word originally comes from. 💡" onclick="openLightbox(this)">
    <img src="images/rocks/blue-fluorite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,fluorite,crystal,mineral'" alt="Blue Fluorite" loading="lazy">
    <div class="photo-label">Blue Fluorite</div>
  </div>
  <div class="photo-card" data-fact="Crystals grow one molecule at a time, sometimes over millions of years underground. The largest crystal cave ever found in Mexico contains crystals 11 meters tall — taller than a 3-story building. 💎" onclick="openLightbox(this)">
    <img src="images/rocks/blue-quartz.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,quartz,crystal,mineral'" alt="Blue Quartz Crystal" loading="lazy">
    <div class="photo-label">Blue Quartz Crystal</div>
  </div>
  <div class="photo-card" data-fact="Blue diamonds get their color from boron atoms trapped in the crystal. The famous Hope Diamond is blue and allegedly cursed — 45.52 carats of extraordinary beauty and terrible luck. 💙😱" onclick="openLightbox(this)">
    <img src="images/rocks/blue-diamond.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,diamond,gem,crystal'" alt="Blue Diamond" loading="lazy">
    <div class="photo-label">Blue Diamond</div>
  </div>
  <div class="photo-card" data-fact="Moonstone has a glowing light inside called adularescence — it looks like moonlight trapped beneath the surface. Ancient Romans literally believed it was made from frozen moonbeams. 🌙" onclick="openLightbox(this)">
    <img src="images/rocks/moonstone.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/moonstone,blue,gem,mineral'" alt="Blue Moonstone" loading="lazy">
    <div class="photo-label">Blue Moonstone</div>
  </div>
  <div class="photo-card" data-fact="Larimar exists in only one location on Earth — a single remote mountain in the Dominican Republic. It's one of the rarest minerals in existence. Some things are beautiful because they're rare. 💙" onclick="openLightbox(this)">
    <img src="images/rocks/larimar.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/larimar,blue,mineral,gem'" alt="Larimar" loading="lazy">
    <div class="photo-label">Larimar</div>
  </div>
  <div class="photo-card" data-fact="Kyanite is so hard in one direction it can scratch steel — yet soft enough in the other direction to be scratched by a fingernail. Same mineral, completely different personalities depending on angle. 🪨" onclick="openLightbox(this)">
    <img src="images/rocks/blue-kyanite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/kyanite,blue,crystal,mineral'" alt="Blue Kyanite" loading="lazy">
    <div class="photo-label">Blue Kyanite</div>
  </div>
  <div class="photo-card" data-fact="Apatite is named from the Greek word 'to deceive' because it was constantly mistaken for more valuable gems like aquamarine and tourmaline. Even minerals can have an identity crisis. 😄" onclick="openLightbox(this)">
    <img src="images/rocks/blue-apatite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/apatite,blue,crystal,mineral'" alt="Blue Apatite" loading="lazy">
    <div class="photo-label">Blue Apatite</div>
  </div>
  <div class="photo-card" data-fact="Blue calcite forms from the compressed shells of ancient sea creatures. The rock you're looking at is made of millions of tiny creatures that lived in an ocean hundreds of millions of years ago. 🌊" onclick="openLightbox(this)">
    <img src="images/rocks/blue-calcite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,calcite,crystal,mineral'" alt="Blue Calcite" loading="lazy">
    <div class="photo-label">Blue Calcite</div>
  </div>
  <div class="photo-card" data-fact="Sodalite became so famous in Canada after being used in the Royal Ontario Museum that Canadians nicknamed it 'Princess Blue.' A mineral famous enough to get a royal title. 👑" onclick="openLightbox(this)">
    <img src="images/rocks/sodalite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/sodalite,blue,mineral,stone'" alt="Sodalite" loading="lazy">
    <div class="photo-label">Sodalite</div>
  </div>
  <div class="photo-card" data-fact="Chalcedony has been shaped into tools and jewelry for over 30,000 years — making it one of the very first materials humans ever worked with. Some of the oldest known art tools were made from it." onclick="openLightbox(this)">
    <img src="images/rocks/blue-chalcedony.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,chalcedony,mineral,gem'" alt="Blue Chalcedony" loading="lazy">
    <div class="photo-label">Blue Chalcedony</div>
  </div>
  <div class="photo-card" data-fact="Azurite gets its vivid blue from copper. Left exposed to air over thousands of years, it slowly transforms into green malachite — it literally changes color as it ages. A slow blue-to-green metamorphosis. 🦋" onclick="openLightbox(this)">
    <img src="images/rocks/azurite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/azurite,blue,mineral,copper'" alt="Azurite" loading="lazy">
    <div class="photo-label">Azurite</div>
  </div>
  <div class="photo-card" data-fact="Labradorite shows a flash of vivid blue-green light when tilted — this is called labradorescence. The Inuit people believed the stone contained the Northern Lights trapped inside rock forever. 🌌" onclick="openLightbox(this)">
    <img src="images/rocks/labradorite.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/labradorite,blue,mineral,gem'" alt="Labradorite" loading="lazy">
    <div class="photo-label">Labradorite</div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-fact" id="lightbox-fact"></p>
  </div>
</div>
<button class="to-top" id="to-top">↑</button>
<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    starsEl.appendChild(s);
  }
  function openLightbox(card) {
    document.getElementById('lightbox-img').src = card.querySelector('img').src;
    document.getElementById('lightbox-fact').textContent = card.dataset.fact || '';
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(e) {
    if (e && e.target === document.getElementById('lightbox-img')) return;
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  const toTopBtn = document.getElementById('to-top');
  window.addEventListener('scroll', () => { toTopBtn.classList.toggle('visible', window.scrollY > 300); });
  toTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
</script>
</body>
</html>
