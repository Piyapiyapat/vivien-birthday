<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Things & Gadgets — Vivien's Birthday 💙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #050f1e; overflow-x: hidden; }
    body { font-family: 'Georgia', serif; background: linear-gradient(160deg, #050f1e 0%, #0d2340 50%, #071628 100%); min-height: 100vh; color: #e8f4fd; }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; background: #90caf9; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    body { padding-top: 58px; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(5,15,30,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(100,180,255,0.1); }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; background: rgba(13,35,64,0.7); border: 1px solid rgba(100,180,255,0.22); border-radius: 100px; color: #90caf9; text-decoration: none; font-size: 0.85rem; transition: background 0.2s, border-color 0.2s; white-space: nowrap; flex-shrink: 0; }
    .back-btn:hover { background: rgba(20,50,90,0.9); border-color: rgba(100,180,255,0.4); }
    .header-title { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; color: #bbdefb; min-width: 0; }
    .header-spacer { width: 72px; flex-shrink: 0; }
    .header-icon { font-size: 1.1rem; flex-shrink: 0; }
    .header-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .to-top { position: fixed; bottom: 24px; right: 20px; z-index: 200; width: 42px; height: 42px; background: rgba(13,35,64,0.85); border: 1px solid rgba(100,180,255,0.28); border-radius: 50%; color: #90caf9; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(8px); transition: opacity 0.3s, transform 0.3s, background 0.2s; pointer-events: none; }
    .to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .to-top:hover { background: rgba(20,50,95,0.95); border-color: rgba(100,180,255,0.5); }
    .page-hero { position: relative; z-index: 1; text-align: center; padding: 28px 20px 16px; }
    .page-icon { font-size: 2.8rem; display: block; margin-bottom: 10px; animation: float 3.5s ease-in-out infinite; }
    .page-hero h1 { font-size: clamp(1.8rem,6vw,3rem); background: linear-gradient(135deg,#90caf9,#e3f2fd 45%,#42a5f5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .photo-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; max-width: 920px; margin: 0 auto; padding: 16px 16px 60px; position: relative; z-index: 1; }
    @media (min-width: 560px) { .photo-grid { grid-template-columns: repeat(3,1fr); } }
    @media (min-width: 860px) { .photo-grid { grid-template-columns: repeat(4,1fr); max-width: 1200px; } }
    @media (min-width: 1200px) { .photo-grid { grid-template-columns: repeat(5,1fr); max-width: 1500px; } }
    .photo-card { border-radius: 18px; overflow: hidden; aspect-ratio: 1; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.45); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; background: #0d2340; }
    .photo-card:hover { transform: scale(1.05); box-shadow: 0 8px 32px rgba(100,180,255,0.28); }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.3s ease; }
    .photo-card:hover img { filter: brightness(1.1) saturate(1.15); }
    .photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent,rgba(2,18,50,0.85)); color: #ddeeff; padding: 22px 12px 10px; font-size: 0.82rem; opacity: 0; transition: opacity 0.3s ease; }
    .photo-card:hover .photo-label { opacity: 1; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,8,24,0.96); z-index: 1000; justify-content: center; align-items: center; padding: 55px 20px 20px; }
    .lightbox.active { display: flex; }
    .lightbox-content { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 540px; }
    .lightbox-content img { width: 100%; max-height: 48vh; object-fit: contain; border-radius: 14px; box-shadow: 0 0 60px rgba(80,160,255,0.25); }
    .lightbox-fact { color: #b0d8f5; font-size: 0.9rem; text-align: center; line-height: 1.7; padding: 14px 18px; background: rgba(13,35,64,0.75); border-radius: 14px; border: 1px solid rgba(100,180,255,0.18); font-style: italic; width: 100%; }
    @media (min-width: 640px) { .lightbox-content { flex-direction: row; max-width: 860px; align-items: center; gap: 28px; } .lightbox-content img { width: auto; max-width: 55%; max-height: 78vh; } .lightbox-fact { flex: 1; text-align: left; font-size: 0.95rem; } }
    .lightbox-close { position: fixed; top: 16px; right: 20px; background: none; border: 2px solid #2a5a9e; color: #90caf9; font-size: 1.4rem; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 10; }
    .lightbox-close:hover { background: rgba(100,180,255,0.15); }
  </style>
</head>
<body>
<div class="stars" id="stars"></div>
<header class="site-header">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="header-title">
    <span class="header-icon">🎧</span>
    <span class="header-name">Things & Gadgets</span>
  </div>
  <div class="header-spacer"></div>
</header>
<header class="page-hero">
  <span class="page-icon">🎧</span>
  <h1>Things & Gadgets</h1>
</header>
<div class="photo-grid">
  <div class="photo-card" data-fact="The first headphones were invented in 1910 by Nathaniel Baldwin — he hand-built them in his kitchen and sold them directly to the US Navy. A one-man headphone factory. 🎧" onclick="openLightbox(this)">
    <img src="images/things/blue-headphones.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,headphones'" alt="Blue Headphones" loading="lazy">
    <div class="photo-label">Blue Headphones</div>
  </div>
  <div class="photo-card" data-fact="The very first photograph ever taken required an 8-hour exposure time. If cameras still worked that way, you'd only photograph things you were truly committed to. Choose wisely. 📷" onclick="openLightbox(this)">
    <img src="images/things/blue-camera.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,camera,vintage'" alt="Blue Camera" loading="lazy">
    <div class="photo-label">Blue Camera</div>
  </div>
  <div class="photo-card" data-fact="The word 'sneakers' comes from the fact that rubber soles were so silent you could sneak around in them without being heard. Crime footwear that became a global fashion icon. 👟" onclick="openLightbox(this)">
    <img src="images/things/blue-sneakers.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,sneakers,shoes'" alt="Blue Sneakers" loading="lazy">
    <div class="photo-label">Blue Sneakers</div>
  </div>
  <div class="photo-card" data-fact="Bicycles are considered one of the most efficient machines ever invented — they convert human energy to motion more efficiently than any other vehicle. And blue ones are the fastest. (Probably.) 🚲" onclick="openLightbox(this)">
    <img src="images/things/blue-bicycle.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,bicycle'" alt="Blue Bicycle" loading="lazy">
    <div class="photo-label">Blue Bicycle</div>
  </div>
  <div class="photo-card" data-fact="Umbrellas were originally invented to block the sun, not rain. Using one in the rain was considered strange and eccentric at first. 'Why is that person blocking the sky?' ☂️" onclick="openLightbox(this)">
    <img src="images/things/blue-umbrella.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,umbrella,rain'" alt="Blue Umbrella" loading="lazy">
    <div class="photo-label">Blue Umbrella</div>
  </div>
  <div class="photo-card" data-fact="The Library of Congress has over 170 million items. Reading one per day would take 465,000 years. Somewhere in there are books that have never been read by anyone alive today. 📚" onclick="openLightbox(this)">
    <img src="images/things/blue-books.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,books,reading'" alt="Blue Books" loading="lazy">
    <div class="photo-label">Blue Books</div>
  </div>
  <div class="photo-card" data-fact="The very first car ever made had a top speed of 16 km/h. A competitive cyclist could have raced it and won. 'Don't worry, I'll just overtake the automobile.' 🚗" onclick="openLightbox(this)">
    <img src="images/things/blue-vintage-car.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,car,vintage'" alt="Blue Vintage Car" loading="lazy">
    <div class="photo-label">Blue Vintage Car</div>
  </div>
  <div class="photo-card" data-fact="In Mediterranean cultures, painting your door blue is believed to ward off evil spirits. Coincidentally, blue doors also actually repel mosquitoes — the color genuinely bothers them. 🚪" onclick="openLightbox(this)">
    <img src="images/things/blue-door.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,door,architecture'" alt="Blue Door" loading="lazy">
    <div class="photo-label">Blue Door</div>
  </div>
  <div class="photo-card" data-fact="Research shows that drinking from a blue mug makes coffee taste milder and slightly more sweet. The color of your cup literally changes how your brain perceives the flavor. ☕" onclick="openLightbox(this)">
    <img src="images/things/blue-mug.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,mug,coffee,cup'" alt="Blue Mug" loading="lazy">
    <div class="photo-label">Blue Mug</div>
  </div>
  <div class="photo-card" data-fact="The average person walks about 100,000 km in their lifetime — roughly two and a half times around the Earth. A good backpack goes every single step of that journey with you. 🎒" onclick="openLightbox(this)">
    <img src="images/things/blue-backpack.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,backpack'" alt="Blue Backpack" loading="lazy">
    <div class="photo-label">Blue Backpack</div>
  </div>
  <div class="photo-card" data-fact="Real neon signs glow red-orange. Blue signs use mercury vapor, not neon. So 'neon blue' is technically a complete lie — but an absolutely beautiful one. Science is sometimes wrong aesthetically. 💡" onclick="openLightbox(this)">
    <img src="images/things/blue-neon-sign.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,neon,sign,light'" alt="Blue Neon Sign" loading="lazy">
    <div class="photo-label">Blue Neon Sign</div>
  </div>
  <div class="photo-card" data-fact="Before electric lights, people used lanterns burning whale oil. We switched to electricity and saved the whales. Better light, saved whales — a genuine win for everyone involved. 🐋" onclick="openLightbox(this)">
    <img src="images/things/blue-lantern.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,lantern,light'" alt="Blue Lantern" loading="lazy">
    <div class="photo-label">Blue Lantern</div>
  </div>
  <div class="photo-card" data-fact="The world's longest knitted scarf measured over 1,000 meters. That's longer than 10 football fields. Someone really committed to keeping one very, very long neck warm. 🧣" onclick="openLightbox(this)">
    <img src="images/things/blue-scarf.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,scarf,fashion'" alt="Blue Scarf" loading="lazy">
    <div class="photo-label">Blue Scarf</div>
  </div>
  <div class="photo-card" data-fact="Sofas were originally called 'causeuses' in French, meaning 'gossip chairs' — designed specifically for long conversations. History has officially validated spending hours doing nothing on the couch. 🛋️" onclick="openLightbox(this)">
    <img src="images/things/blue-sofa.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,sofa,couch,interior'" alt="Blue Sofa" loading="lazy">
    <div class="photo-label">Blue Sofa</div>
  </div>
  <div class="photo-card" data-fact="The first typewriter weighed 80 pounds. A modern laptop weighs about 2 pounds and is infinitely more powerful. Progress is real, and your wrists are very grateful. ⌨️" onclick="openLightbox(this)">
    <img src="images/things/blue-typewriter.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,typewriter,vintage'" alt="Blue Typewriter" loading="lazy">
    <div class="photo-label">Blue Typewriter</div>
  </div>
  <div class="photo-card" data-fact="The most expensive guitar ever sold went for $2.7 million — Kurt Cobain's acoustic. Blue guitars are significantly more affordable and, arguably, more fun to play. 🎸" onclick="openLightbox(this)">
    <img src="images/things/blue-guitar.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,guitar,music'" alt="Blue Guitar" loading="lazy">
    <div class="photo-label">Blue Guitar</div>
  </div>
  <div class="photo-card" data-fact="Alexander Graham Bell's first words ever spoken on a telephone were 'Mr. Watson, come here — I want to see you.' Not exactly poetry, but it started everything we have today. 📞" onclick="openLightbox(this)">
    <img src="images/things/blue-telephone.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,telephone,vintage,retro'" alt="Blue Telephone" loading="lazy">
    <div class="photo-label">Blue Telephone</div>
  </div>
  <div class="photo-card" data-fact="Before email existed, some people wrote up to 10 letters per day. The postal service once delivered mail twice daily in major cities. Imagine getting 10 handwritten letters from people who care. 📬" onclick="openLightbox(this)">
    <img src="images/things/blue-mailbox.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,mailbox,post'" alt="Blue Mailbox" loading="lazy">
    <div class="photo-label">Blue Mailbox</div>
  </div>
  <div class="photo-card" data-fact="Humans have been sailing for at least 40,000 years — long before written language, before farming, before almost everything. The ocean has always called to us, and we've always answered. ⛵" onclick="openLightbox(this)">
    <img src="images/things/blue-sailboat.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,sailboat,sea'" alt="Blue Sailboat" loading="lazy">
    <div class="photo-label">Blue Sailboat</div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-fact" id="lightbox-fact"></p>
  </div>
</div>
<button class="to-top" id="to-top">↑</button>
<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    starsEl.appendChild(s);
  }
  function openLightbox(card) {
    document.getElementById('lightbox-img').src = card.querySelector('img').src;
    document.getElementById('lightbox-fact').textContent = card.dataset.fact || '';
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(e) {
    if (e && e.target === document.getElementById('lightbox-img')) return;
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  const toTopBtn = document.getElementById('to-top');
  window.addEventListener('scroll', () => { toTopBtn.classList.toggle('visible', window.scrollY > 300); });
  toTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
</script>
</body>
</html>
