<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Flowers — Vivien's Birthday 💙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Georgia', serif; background: linear-gradient(160deg, #050f1e 0%, #0d2340 50%, #071628 100%); min-height: 100vh; color: #e8f4fd; }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; background: #90caf9; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    body { padding-top: 58px; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(5,15,30,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(100,180,255,0.1); }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; background: rgba(13,35,64,0.7); border: 1px solid rgba(100,180,255,0.22); border-radius: 100px; color: #90caf9; text-decoration: none; font-size: 0.85rem; transition: background 0.2s, border-color 0.2s; white-space: nowrap; flex-shrink: 0; }
    .back-btn:hover { background: rgba(20,50,90,0.9); border-color: rgba(100,180,255,0.4); }
    .header-title { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; color: #bbdefb; min-width: 0; }
    .header-spacer { width: 72px; flex-shrink: 0; }
    .header-icon { font-size: 1.1rem; flex-shrink: 0; }
    .header-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .to-top { position: fixed; bottom: 24px; right: 20px; z-index: 200; width: 42px; height: 42px; background: rgba(13,35,64,0.85); border: 1px solid rgba(100,180,255,0.28); border-radius: 50%; color: #90caf9; font-size: 1.1rem; cursor: pointer; display: flex; align-items: center; justify-content: center; opacity: 0; transform: translateY(8px); transition: opacity 0.3s, transform 0.3s, background 0.2s; pointer-events: none; }
    .to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
    .to-top:hover { background: rgba(20,50,95,0.95); border-color: rgba(100,180,255,0.5); }
    .page-hero { position: relative; z-index: 1; text-align: center; padding: 28px 20px 16px; }
    .page-icon { font-size: 2.8rem; display: block; margin-bottom: 10px; animation: float 3.5s ease-in-out infinite; }
    .page-hero h1 { font-size: clamp(1.8rem,6vw,3rem); background: linear-gradient(135deg,#90caf9,#e3f2fd 45%,#42a5f5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .photo-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 10px; max-width: 920px; margin: 0 auto; padding: 16px 16px 60px; position: relative; z-index: 1; }
    @media (min-width: 560px) { .photo-grid { grid-template-columns: repeat(3,1fr); } }
    @media (min-width: 860px) { .photo-grid { grid-template-columns: repeat(4,1fr); max-width: 1200px; } }
    @media (min-width: 1200px) { .photo-grid { grid-template-columns: repeat(5,1fr); max-width: 1500px; } }
    .photo-card { border-radius: 18px; overflow: hidden; aspect-ratio: 1; position: relative; box-shadow: 0 4px 24px rgba(0,0,0,0.45); cursor: pointer; transition: transform 0.3s ease, box-shadow 0.3s ease; background: #0d2340; }
    .photo-card:hover { transform: scale(1.05); box-shadow: 0 8px 32px rgba(100,180,255,0.28); }
    .photo-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.3s ease; }
    .photo-card:hover img { filter: brightness(1.1) saturate(1.15); }
    .photo-label { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent,rgba(2,18,50,0.85)); color: #ddeeff; padding: 22px 12px 10px; font-size: 0.82rem; opacity: 0; transition: opacity 0.3s ease; }
    .photo-card:hover .photo-label { opacity: 1; }
    .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,8,24,0.96); z-index: 1000; justify-content: center; align-items: center; padding: 55px 20px 20px; }
    .lightbox.active { display: flex; }
    .lightbox-content { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; max-width: 540px; }
    .lightbox-content img { width: 100%; max-height: 48vh; object-fit: contain; border-radius: 14px; box-shadow: 0 0 60px rgba(80,160,255,0.25); }
    .lightbox-fact { color: #b0d8f5; font-size: 0.9rem; text-align: center; line-height: 1.7; padding: 14px 18px; background: rgba(13,35,64,0.75); border-radius: 14px; border: 1px solid rgba(100,180,255,0.18); font-style: italic; width: 100%; }
    @media (min-width: 640px) { .lightbox-content { flex-direction: row; max-width: 860px; align-items: center; gap: 28px; } .lightbox-content img { width: auto; max-width: 55%; max-height: 78vh; } .lightbox-fact { flex: 1; text-align: left; font-size: 0.95rem; } }
    .lightbox-close { position: fixed; top: 16px; right: 20px; background: none; border: 2px solid #2a5a9e; color: #90caf9; font-size: 1.4rem; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; z-index: 10; }
    .lightbox-close:hover { background: rgba(100,180,255,0.15); }
  </style>
</head>
<body>
<div class="stars" id="stars"></div>
<header class="site-header">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="header-title">
    <span class="header-icon">🌸</span>
    <span class="header-name">Blue Flowers</span>
  </div>
  <div class="header-spacer"></div>
</header>
<header class="page-hero">
  <span class="page-icon">🌸</span>
  <h1>Blue Flowers</h1>
</header>
<div class="photo-grid">
  <div class="photo-card" data-fact="Blue hydrangeas get their color from aluminum in acidic soil — they're basically nature's pH strips! The same plant can grow pink or blue depending on where it's planted. 🔵" onclick="openLightbox(this)">
    <img src="images/flowers/blue-hydrangea.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,hydrangea'" alt="Blue Hydrangea" loading="lazy">
    <div class="photo-label">Blue Hydrangea</div>
  </div>
  <div class="photo-card" data-fact="The iris was named after the Greek goddess of the rainbow. Out of all the colors she could have picked, blue was clearly her best look. 🌈" onclick="openLightbox(this)">
    <img src="images/flowers/blue-iris.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,iris,flower'" alt="Blue Iris" loading="lazy">
    <div class="photo-label">Blue Iris</div>
  </div>
  <div class="photo-card" data-fact="Morning glories close every night and reopen each morning — basically the original 'do not disturb' mode. They only come out when they feel like it. 🌅" onclick="openLightbox(this)">
    <img src="images/flowers/morning-glory.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/morning,glory,blue'" alt="Morning Glory" loading="lazy">
    <div class="photo-label">Morning Glory</div>
  </div>
  <div class="photo-card" data-fact="Forget-me-nots are the official state flower of Alaska. Even in a place that cold, nobody can forget how pretty they are! ❄️" onclick="openLightbox(this)">
    <img src="images/flowers/forget-me-not.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/forget,me,not,flower'" alt="Forget-Me-Not" loading="lazy">
    <div class="photo-label">Forget-Me-Not</div>
  </div>
  <div class="photo-card" data-fact="Delphiniums can grow up to 6 feet tall — the blue skyscrapers of the flower world. They're basically overachievers in a garden full of regular-height plants. 🏙️" onclick="openLightbox(this)">
    <img src="images/flowers/delphinium.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/delphinium,blue'" alt="Delphiniums" loading="lazy">
    <div class="photo-label">Delphiniums</div>
  </div>
  <div class="photo-card" data-fact="Wild blue flowers have inspired artists for centuries. Van Gogh was literally obsessed with blue flowers — he painted them over and over because blue was his emotional color. 🎨" onclick="openLightbox(this)">
    <img src="images/flowers/wild-blue-flowers.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,wildflowers'" alt="Wild Blue Flowers" loading="lazy">
    <div class="photo-label">Wild Blue Flowers</div>
  </div>
  <div class="photo-card" data-fact="Cornflowers were once so common in European grain fields that farmers considered them weeds. Imagine calling this beautiful blue thing a weed and trying to get rid of it. 😤" onclick="openLightbox(this)">
    <img src="images/flowers/cornflower.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/cornflower,blue'" alt="Cornflower" loading="lazy">
    <div class="photo-label">Cornflower</div>
  </div>
  <div class="photo-card" data-fact="Ancient bluebell woods in England can be thousands of years old. Some bluebell patches you walk past today were blooming when Shakespeare was alive. 🎭" onclick="openLightbox(this)">
    <img src="images/flowers/bluebell.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/bluebell,flower'" alt="Bluebell" loading="lazy">
    <div class="photo-label">Bluebell</div>
  </div>
  <div class="photo-card" data-fact="Agapanthus literally means 'love flower' in Greek. So this is basically a flower that says 'I love you' without saying a single word. 💙" onclick="openLightbox(this)">
    <img src="images/flowers/agapanthus.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/agapanthus,blue'" alt="Agapanthus" loading="lazy">
    <div class="photo-label">Agapanthus</div>
  </div>
  <div class="photo-card" data-fact="Despite the name, grape hyacinths are not actually hyacinths. They just really wanted the prestigious title and went for it. Respect the ambition. 🍇" onclick="openLightbox(this)">
    <img src="images/flowers/grape-hyacinth.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/grape,hyacinth,blue'" alt="Grape Hyacinth" loading="lazy">
    <div class="photo-label">Grape Hyacinth</div>
  </div>
  <div class="photo-card" data-fact="The blue lotus was so sacred in ancient Egypt it was carved into temple walls everywhere. It was basically the celebrity flower of its era — everyone wanted one. ✨" onclick="openLightbox(this)">
    <img src="images/flowers/blue-lotus.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,lotus,flower'" alt="Blue Lotus" loading="lazy">
    <div class="photo-label">Blue Lotus</div>
  </div>
  <div class="photo-card" data-fact="Salvia comes from the Latin 'salvare' meaning 'to heal.' So blue salvia is not just beautiful — it's therapeutic. Blue really does heal. 💊" onclick="openLightbox(this)">
    <img src="images/flowers/blue-salvia.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,salvia,flower'" alt="Blue Salvia" loading="lazy">
    <div class="photo-label">Blue Salvia</div>
  </div>
  <div class="photo-card" data-fact="The Himalayan blue poppy is so rare and difficult to grow that gardeners literally call it 'the Holy Grail of blue flowers.' Most gardeners spend years trying to grow one. 🏆" onclick="openLightbox(this)">
    <img src="images/flowers/himalayan-poppy.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/himalayan,blue,poppy'" alt="Himalayan Blue Poppy" loading="lazy">
    <div class="photo-label">Himalayan Poppy</div>
  </div>
  <div class="photo-card" data-fact="Chicory roots are roasted and used as a coffee substitute. So technically, you could have a blue-flower coffee morning ☕ — and it's completely caffeine-free." onclick="openLightbox(this)">
    <img src="images/flowers/chicory.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/chicory,blue,flower'" alt="Chicory" loading="lazy">
    <div class="photo-label">Chicory</div>
  </div>
  <div class="photo-card" data-fact="Anemones are called 'windflowers' because they open when the wind blows. Free-spirited by literal definition — they bloom on their own terms. 🌬️" onclick="openLightbox(this)">
    <img src="images/flowers/blue-anemone.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,anemone,flower'" alt="Blue Anemone" loading="lazy">
    <div class="photo-label">Blue Anemone</div>
  </div>
  <div class="photo-card" data-fact="Borage flowers are edible! You can toss them in salads or freeze them inside ice cubes for fancy drinks. Blue flowers in your drink? That's main character energy. 🧊" onclick="openLightbox(this)">
    <img src="images/flowers/borage.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/borage,blue,flower'" alt="Borage" loading="lazy">
    <div class="photo-label">Borage</div>
  </div>
  <div class="photo-card" data-fact="Periwinkle blue is so distinct it became its own named color. Most flowers just exist — periwinkle was iconic enough to define a shade. That's power. 💅" onclick="openLightbox(this)">
    <img src="images/flowers/periwinkle.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/periwinkle,blue,flower'" alt="Periwinkle" loading="lazy">
    <div class="photo-label">Periwinkle</div>
  </div>
  <div class="photo-card" data-fact="Ancient people believed asters were the tears of the goddess Astraea, fallen from the sky as stars. So every aster is basically a fallen star. 🌟" onclick="openLightbox(this)">
    <img src="images/flowers/blue-aster.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/blue,aster,flower'" alt="Blue Aster" loading="lazy">
    <div class="photo-label">Blue Aster</div>
  </div>
  <div class="photo-card" data-fact="Wisteria can live for over 100 years. The oldest wisteria in Japan is over 1,200 years old and still blooming every spring. Some things just get more beautiful with time. 💙" onclick="openLightbox(this)">
    <img src="images/flowers/blue-wisteria.jpg" onerror="this.onerror=null;this.src='https://loremflickr.com/600/600/wisteria,blue,purple'" alt="Blue Wisteria" loading="lazy">
    <div class="photo-label">Blue Wisteria</div>
  </div>
</div>
<div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
  <button class="lightbox-close" onclick="closeLightbox()">×</button>
  <div class="lightbox-content">
    <img id="lightbox-img" src="" alt="">
    <p class="lightbox-fact" id="lightbox-fact"></p>
  </div>
</div>
<button class="to-top" id="to-top">↑</button>
<script>
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    starsEl.appendChild(s);
  }
  function openLightbox(card) {
    document.getElementById('lightbox-img').src = card.querySelector('img').src;
    document.getElementById('lightbox-fact').textContent = card.dataset.fact || '';
    document.getElementById('lightbox').classList.add('active');
    document.body.style.overflow = 'hidden';
  }
  function closeLightbox(e) {
    if (e && e.target === document.getElementById('lightbox-img')) return;
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
  const toTopBtn = document.getElementById('to-top');
  window.addEventListener('scroll', () => { toTopBtn.classList.toggle('visible', window.scrollY > 300); });
  toTopBtn.addEventListener('click', () => { window.scrollTo({ top: 0, behavior: 'smooth' }); });
</script>
</body>
</html>
