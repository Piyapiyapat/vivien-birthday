<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quotes About Blue — Vivien's Birthday 💙</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { background: #050f1e; overflow-x: hidden; }
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(160deg, #050f1e 0%, #0d2340 50%, #071628 100%);
      min-height: 100vh;
      color: #e8f4fd;
      padding-top: 58px;
    }
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
    .star { position: absolute; background: #90caf9; border-radius: 50%; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }

    /* ── Fixed header ── */
    body { padding-top: 58px; }
    .site-header { position: fixed; top: 0; left: 0; right: 0; z-index: 200; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: rgba(5,15,30,0.9); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid rgba(100,180,255,0.1); }
    .back-btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; background: rgba(13,35,64,0.7); border: 1px solid rgba(100,180,255,0.22); border-radius: 100px; color: #90caf9; text-decoration: none; font-size: 0.85rem; transition: background 0.2s, border-color 0.2s; white-space: nowrap; flex-shrink: 0; }
    .back-btn:hover { background: rgba(20,50,90,0.9); border-color: rgba(100,180,255,0.4); }
    .header-title { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 0.95rem; color: #bbdefb; }
    .header-icon { font-size: 1.1rem; flex-shrink: 0; }
    .header-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .header-spacer { width: 72px; flex-shrink: 0; }

    /* ── Flashcard layout ── */
    .flashcard-wrapper {
      position: relative;
      z-index: 1;
      min-height: calc(100vh - 58px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 20px 40px;
      gap: 24px;
    }

    .progress {
      font-size: 0.8rem;
      color: #4a7ab5;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 560px;
      background: rgba(13,35,64,0.72);
      border: 1px solid rgba(100,180,255,0.18);
      border-radius: 26px;
      padding: 48px 30px 34px;
      position: relative;
      box-shadow: 0 12px 50px rgba(0,0,0,0.45), 0 0 80px rgba(100,180,255,0.07);
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(18px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1);    }
    }
    .card.slide-left  { animation: slideLeft  0.28s ease forwards; }
    .card.slide-right { animation: slideRight 0.28s ease forwards; }
    .card.enter-right { animation: enterRight 0.28s ease forwards; }
    .card.enter-left  { animation: enterLeft  0.28s ease forwards; }
    @keyframes slideLeft  { to { opacity: 0; transform: translateX(-60px) scale(0.95); } }
    @keyframes slideRight { to { opacity: 0; transform: translateX( 60px) scale(0.95); } }
    @keyframes enterRight { from { opacity: 0; transform: translateX( 60px) scale(0.95); } to { opacity: 1; transform: none; } }
    @keyframes enterLeft  { from { opacity: 0; transform: translateX(-60px) scale(0.95); } to { opacity: 1; transform: none; } }

    .card-quote-mark {
      font-size: 7rem;
      color: rgba(100,180,255,0.09);
      font-family: Georgia, serif;
      line-height: 1;
      position: absolute;
      top: 10px;
      left: 20px;
      user-select: none;
    }
    .card-text {
      font-size: clamp(1rem, 2.5vw, 1.2rem);
      line-height: 1.9;
      color: #cce5f8;
      font-style: italic;
      flex: 1;
      padding-top: 16px;
    }
    .card-author {
      font-size: 0.85rem;
      color: #4a7ab5;
      text-align: right;
      margin-top: 22px;
      padding-top: 16px;
      border-top: 1px solid rgba(100,180,255,0.1);
      letter-spacing: 0.02em;
    }

    /* ── Navigation ── */
    .nav {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .nav-btn {
      width: 50px;
      height: 50px;
      background: rgba(13,35,64,0.7);
      border: 1px solid rgba(100,180,255,0.22);
      border-radius: 50%;
      color: #90caf9;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(20,50,95,0.9);
      border-color: rgba(100,180,255,0.45);
      transform: scale(1.08);
    }
    .nav-btn:active:not(:disabled) { transform: scale(0.95); }
    .nav-btn:disabled { opacity: 0.25; cursor: default; }

    .hint {
      font-size: 0.75rem;
      color: rgba(100,180,255,0.25);
      letter-spacing: 0.06em;
    }

    /* ── Progress dots ── */
    .dots {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 260px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(100,180,255,0.2);
      transition: background 0.3s, transform 0.3s;
    }
    .dot.active {
      background: #90caf9;
      transform: scale(1.3);
    }
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<header class="site-header">
  <a href="index.html" class="back-btn">← Back</a>
  <div class="header-title">
    <span class="header-icon">💬</span>
    <span class="header-name">Quotes About Blue</span>
  </div>
  <div class="header-spacer"></div>
</header>

<div class="flashcard-wrapper">
  <p class="progress" id="progress">1 / 16</p>

  <div class="card" id="card">
    <span class="card-quote-mark">"</span>
    <p class="card-text" id="card-text"></p>
    <p class="card-author" id="card-author"></p>
  </div>

  <div class="nav">
    <button class="nav-btn" id="prev-btn" aria-label="Previous" onclick="go(-1)">←</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="next-btn" aria-label="Next" onclick="go(1)">→</button>
  </div>

  <p class="hint">swipe left / right &nbsp;·&nbsp; ← → keys</p>
</div>

<script>
  const quotes = [
    { text: "Blue has no dimensions, it is beyond dimensions, whereas the other colors are not.",
      author: "Yves Klein" },
    { text: "The deeper the blue becomes, the more strongly it calls man towards the infinite, awakening in him a desire for the pure and, finally, for the supernatural.",
      author: "Wassily Kandinsky" },
    { text: "I never get tired of the blue sky.",
      author: "Vincent van Gogh" },
    { text: "Blue is the color of longing for the distances you never arrive in.",
      author: "Rebecca Solnit" },
    { text: "The sky is the daily bread of the eyes.",
      author: "Ralph Waldo Emerson" },
    { text: "You are not a drop in the ocean. You are the entire ocean in a drop.",
      author: "Rumi" },
    { text: "The cure for anything is salt water — sweat, tears, or the sea.",
      author: "Isak Dinesen" },
    { text: "If the ocean can calm itself, so can you. We are both salt water mixed with air.",
      author: "Nayyirah Waheed" },
    { text: "Blue is the only color which maintains its own character in all its tones. It will always stay blue.",
      author: "Raoul Dufy" },
    { text: "The sea is emotion incarnate. It loves, hates, and weeps. It defies all attempts to capture it with words and rejects all shackles.",
      author: "Christopher Paolini" },
    { text: "I have loved the stars too fondly to be fearful of the night.",
      author: "Galileo Galilei" },
    { text: "Even the darkest night will end and the sun will rise.",
      author: "Victor Hugo" },
    { text: "The ocean stirs the heart, inspires the imagination, and brings eternal joy to the soul.",
      author: "Wyland" },
    { text: "She had a galaxy in her eyes, a universe in her mind, and the ocean in her soul.",
      author: "Anonymous" },
    { text: "Blue is not just a color — it is a whole emotional landscape.",
      author: "Anonymous" },
    { text: "Something about blue — it carries the sky, the sea, and all the quiet spaces in between.",
      author: "Anonymous" },
  ];

  let current = 0;
  let busy = false;
  const cardEl    = document.getElementById('card');
  const textEl    = document.getElementById('card-text');
  const authorEl  = document.getElementById('card-author');
  const progressEl= document.getElementById('progress');
  const prevBtn   = document.getElementById('prev-btn');
  const nextBtn   = document.getElementById('next-btn');
  const dotsEl    = document.getElementById('dots');

  // Build dots
  quotes.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 0 ? ' active' : '');
    d.onclick = () => go(i - current);
    dotsEl.appendChild(d);
  });

  function render() {
    const q = quotes[current];
    textEl.textContent   = q.text;
    authorEl.textContent = '— ' + q.author;
    progressEl.textContent = `${current + 1} / ${quotes.length}`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === quotes.length - 1;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('active', i === current));
  }

  function go(dir) {
    if (busy) return;
    const next = current + dir;
    if (next < 0 || next >= quotes.length) return;

    busy = true;
    const outClass   = dir > 0 ? 'slide-left'  : 'slide-right';
    const enterClass = dir > 0 ? 'enter-right' : 'enter-left';

    // Safety: reset if animationend never fires
    const safetyTimer = setTimeout(() => {
      cardEl.className = 'card';
      current = next;
      render();
      busy = false;
    }, 700);

    cardEl.classList.add(outClass);
    cardEl.addEventListener('animationend', function onOut() {
      cardEl.removeEventListener('animationend', onOut);
      cardEl.classList.remove(outClass);
      current = next;
      render();
      cardEl.classList.add(enterClass);
      cardEl.addEventListener('animationend', function onIn() {
        cardEl.removeEventListener('animationend', onIn);
        cardEl.classList.remove(enterClass);
        clearTimeout(safetyTimer);
        busy = false;
      });
    });
  }

  // Keyboard
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  go(-1);
    if (e.key === 'ArrowRight') go(1);
  });

  // Swipe
  let touchX = 0;
  cardEl.addEventListener('touchstart', e => { touchX = e.touches[0].clientX; }, { passive: true });
  cardEl.addEventListener('touchend', e => {
    const diff = touchX - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 44) go(diff > 0 ? 1 : -1);
  });

  // Stars
  const starsEl = document.getElementById('stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div'); s.className = 'star';
    const size = Math.random() * 2.5 + 0.5;
    s.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;animation-duration:${(Math.random()*4+2).toFixed(1)}s;animation-delay:${(Math.random()*5).toFixed(1)}s;`;
    starsEl.appendChild(s);
  }

  // Play entrance animation once on first load only
  cardEl.style.animation = 'cardIn 0.35s ease';
  cardEl.addEventListener('animationend', () => { cardEl.style.animation = ''; }, { once: true });
  render();
</script>
</body>
</html>
